<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">koim.</a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" onclick="const nav=document.getElementById('site-nav');const visible=nav.classList.toggle('open');this.setAttribute('aria-expanded',visible)">Menu <span aria-hidden="true">☰</span></button>
    <nav id="site-nav" class="nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/works/' | relative_url }}">Works</a>
      <div class="nav-group"><span>Gallery</span>
        <a href="{{ '/gallery/independent/' | relative_url }}">Independent Works</a>
        <a href="{{ '/gallery/projects/' | relative_url }}">Architectural Works</a>
      </div>
      <a href="{{ '/about/' | relative_url }}">About &amp; Contact</a>
    </nav>
  </header>
  <main id="main-content" class="content">{{ content }}</main>
  <footer class="footer"><span>© {{ 'now' | date: '%Y' }} koim.</span><a href="{{ '/' | relative_url }}">Back to top ↑</a></footer>
  <dialog id="image-viewer" class="image-viewer" aria-label="Enlarged artwork">
    <button type="button" class="viewer-close" aria-label="Close image" onclick="closePortfolioImage()">✕</button>
    <img id="viewer-image" alt="">
    <div id="viewer-placeholder" class="placeholder-art" hidden></div>
    <p id="viewer-caption"></p>
  </dialog>
  <script>
    function openPortfolioImage(button) {
      const dialog = document.getElementById('image-viewer');
      const img = document.getElementById('viewer-image');
      const placeholder = document.getElementById('viewer-placeholder');
      const title = button.dataset.title || 'Artwork';
      const src = button.dataset.image;
      img.hidden = !src;
      placeholder.hidden = !!src;
      if (src) { img.src = src; img.alt = title; }
      else { img.removeAttribute('src'); placeholder.textContent = title; }
      document.getElementById('viewer-caption').textContent = title;
      clearTimeout(portfolioCloseTimer);
      dialog.classList.remove('is-visible');
      dialog.showModal();
      requestAnimationFrame(() => requestAnimationFrame(() => dialog.classList.add('is-visible')));
    }
    const portfolioViewer = document.getElementById('image-viewer');
    let portfolioCloseTimer;
    function closePortfolioImage() {
      if (!portfolioViewer.open || !portfolioViewer.classList.contains('is-visible')) return;
      portfolioViewer.classList.remove('is-visible');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        portfolioViewer.close();
        return;
      }
      clearTimeout(portfolioCloseTimer);
      portfolioCloseTimer = setTimeout(() => portfolioViewer.close(), 210);
    }
    portfolioViewer.addEventListener('click', function(e) {
      if (e.target !== this) return;
      const bounds = this.getBoundingClientRect();
      if (e.clientX < bounds.left || e.clientX > bounds.right ||
          e.clientY < bounds.top || e.clientY > bounds.bottom) closePortfolioImage();
    });
    portfolioViewer.addEventListener('cancel', function(e) {
      e.preventDefault();
      closePortfolioImage();
    });
  </script>
</body>
</html>
